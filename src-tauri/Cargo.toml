[package]
name = "moontranslator"
version = "0.2.0"
edition = "2021"
# Uses std::time::Duration::from_mins (stable since 1.86).
rust-version = "1.86"

[lib]
name = "moontranslator_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "moontranslator"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "webview-data-url", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
reqwest = { version = "0.12", features = ["json", "stream", "deflate", "gzip", "brotli", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "fs"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
zip = "2"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
dirs = "5"
urlencoding = "2"
html-escape = "0.2"
screenshots = "0.8"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }
pdf-extract = "0.7"
epub = "2"
regex = "1"
md5 = "0.7"
lindera-ipadic = { version = "0.28", features = ["ipadic"] }
lindera-tokenizer = { version = "0.28", features = ["ipadic"] }
lindera-dictionary = { version = "0.28", features = ["ipadic"] }
lindera-core = "0.28"
rand = "0.8"
flate2 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"
docx-rs = "0.4"
calamine = "0.26"
rust_xlsxwriter = "0.62"
quick-xml = "0.31"
image = "0.25"
ab_glyph = "0.2"
imageproc = "0.24"
fsrs = "6"
# S5-9: decode Shift-JIS / GBK / Big5 / UHC OEM clipboard text correctly.
# Light, no_std-compatible, used by Firefox. Replaces `from_utf8_lossy` for
# CF_OEMTEXT and CF_TEXT when the bytes aren't valid UTF-8.
encoding_rs = "0.8"
# S5-12: resolve PDF sidecar CLIs (magic-pdf / marker_single / ocrmypdf)
# through PATH safely instead of spawning `cmd --help` to probe existence.
# Returns a canonical absolute path, closing PATH-hijack and cwd-injection
# vectors when `sidecar.*_cmd` is a bare name.
which = "7"
# S5-1: generate bilingual PDF output. Pure-Rust PDF writer; we load system
# CJK fonts (e.g. Windows msyh.ttf) at runtime instead of embedding a font
# subset, so the binary stays small.
printpdf = "0.7"
# P7: font subsetting for PDF export. Reduces embedded font size by keeping
# only the glyphs used in the translated text (e.g. msyh.ttf 17MB → ~50KB
# for a typical page). The subsetted font is CID-keyed (cmap removed), so
# we embed it as a CID font in the PDF with a GID→CID identity mapping.
subsetter = "0.2"
# P7: parsing TTF/OTF cmap tables to map Unicode text → glyph IDs before
# subsetting. Lightweight, no unsafe, already a transitive dep of printpdf.
ttf-parser = "0.21"
# P6: ONNX Runtime for DocLayout-YOLO layout detection. Optional — only
# enabled via the `layout-detection` feature so the default build stays
# light. Uses `load-dynamic` so the ONNX Runtime shared library is loaded
# at runtime (like pdfium), not linked at build time.
ort = { version = "2.0.0-rc.12", optional = true, features = ["load-dynamic"] }

# P2: pdfium-render binds to Google's Pdfium C++ library at runtime for
# high-fidelity PDF→IL extraction (per-character positions, fonts, encodings).
# The Pdfium dynamic library (pdfium.dll / libpdfium.so / libpdfium.dylib)
# must be distributed alongside the executable — we try exe dir, then system.
pdfium-render = "0.9"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Globalization",
    "Graphics_Imaging",
    "Foundation_Collections",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Data_Pdf",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bench]]
name = "translation_bench"
harness = false

[[bench]]
name = "cache_bench"
harness = false

[[bench]]
name = "ocr_bench"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }

[lints.clippy]
# Deny these lints (will cause compilation error)
enum_glob_use = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Pedantic lints
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
# Noise-level pedantic lints (high volume, rare/negligible real impact).
# Kept off so remaining warnings stay actionable. Casts are pervasive in
# OCR/geometry/PDF numeric code and are bounded by construction; float_cmp is
# deliberate exact assertions in tests; the rest are pure style.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"
items_after_statements = "allow"
many_single_char_names = "allow"
format_push_string = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
match_same_arms = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
ref_option = "allow"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# P6: enable DocLayout-YOLO ONNX layout detection. Requires the ONNX Runtime
# shared library (onnxruntime.dll) at runtime and a DocLayout-YOLO model file.
layout-detection = ["dep:ort"]
