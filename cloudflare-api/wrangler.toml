name = "moontranslator-api"
main = "src/index.ts"
compatibility_date = "2024-01-17"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "moontranslator-db"
database_id = "YOUR_D1_DATABASE_ID"

# KV 命名空间绑定（用于缓存）
[[kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_NAMESPACE_ID"

# 环境变量
[vars]
GITHUB_DATA_REPO = "your-username/moontranslator-data"
GITHUB_TOKEN = "YOUR_GITHUB_TOKEN"  # 用于私有仓库访问

# AI 代理配置
[vars.AI_PROXY]
enabled = true
