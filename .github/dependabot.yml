version: 2
updates:
  # npm dependencies (frontend)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - frontend
    groups:
      react:
        patterns:
          - react
          - react-dom
          - @types/react
          - @types/react-dom
      tauri-frontend:
        patterns:
          - "@tauri-apps/*"
      dev-tools:
        patterns:
          - eslint*
          - typescript
          - vite
          - vitest

  # Cargo dependencies (Rust backend)
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    groups:
      tauri-rust:
        patterns:
          - tauri
          - tauri-*
      tokio:
        patterns:
          - tokio
          - tokio-*

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
