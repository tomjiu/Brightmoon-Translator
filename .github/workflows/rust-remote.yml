name: Rust Remote

on:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:
    inputs:
      run_check:
        description: Run cargo check
        required: true
        type: boolean
        default: true
      run_tests:
        description: Compile cargo test targets
        required: true
        type: boolean
        default: true
      run_test_binaries:
        description: Run Rust library tests and upload diagnostics on failure
        required: true
        type: boolean
        default: false
      run_clippy:
        description: Run cargo clippy -D warnings
        required: true
        type: boolean
        default: false
      run_tauri_build:
        description: Run full Tauri build
        required: true
        type: boolean
        default: false

concurrency:
  group: rust-remote-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    name: Rust on Windows
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version from package.json packageManager

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend dist
        run: pnpm run build

      - name: Cargo check
        if: ${{ github.event_name == 'push' || inputs.run_check }}
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Compile cargo tests
        if: ${{ github.event_name == 'push' || inputs.run_tests }}
        working-directory: src-tauri
        run: cargo test --all-targets --no-run

      - name: Run Rust library tests
        if: ${{ inputs.run_test_binaries }}
        id: rust_test_binaries
        working-directory: src-tauri
        shell: pwsh
        run: |
          $manifestDependency = "/MANIFESTDEPENDENCY:type='win32' name='Microsoft.Windows.Common-Controls' version='6.0.0.0' processorArchitecture='*' publicKeyToken='6595b64144ccf1df' language='*'"
          $env:CARGO_ENCODED_RUSTFLAGS = "-C$([char]0x1f)link-arg=$manifestDependency"
          cargo test --lib -- --nocapture 2>&1 | Tee-Object -FilePath rust-test-output.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Collect Rust test diagnostics
        if: ${{ failure() && inputs.run_test_binaries && steps.rust_test_binaries.outcome == 'failure' }}
        working-directory: src-tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diagnostics | Out-Null
          "Windows version:" | Out-File diagnostics/environment.txt
          Get-ComputerInfo -Property WindowsProductName, WindowsVersion, OsHardwareAbstractionLayer |
            Format-List | Out-File diagnostics/environment.txt -Append
          "`nPATH:" | Out-File diagnostics/environment.txt -Append
          $env:PATH -split ';' | Out-File diagnostics/environment.txt -Append
          "`nRust test executables:" | Out-File diagnostics/environment.txt -Append
          Get-ChildItem -Path target/debug/deps -Filter "moontranslator_lib-*.exe" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object FullName, Length, LastWriteTime |
            Format-List | Out-File diagnostics/environment.txt -Append
          if (Test-Path rust-test-output.log) {
            Copy-Item rust-test-output.log diagnostics/rust-test-output.log
          }
          "`nTool lookup:" | Out-File diagnostics/environment.txt -Append
          where.exe dumpbin.exe 2>&1 | Out-File diagnostics/environment.txt -Append
          where.exe llvm-objdump.exe 2>&1 | Out-File diagnostics/environment.txt -Append

          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if (-not $dumpbin) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
              if ($vsInstall) {
                $dumpbinPath = Get-ChildItem -Path (Join-Path $vsInstall "VC\Tools\MSVC") -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -like "*\bin\Hostx64\x64\dumpbin.exe" } |
                  Sort-Object FullName -Descending |
                  Select-Object -First 1
                if ($dumpbinPath) {
                  $dumpbin = $dumpbinPath
                }
              }
            }
          }
          $testExecutables = Get-ChildItem -Path target/debug/deps -Filter "moontranslator_lib-*.exe" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 3
          if ($dumpbin) {
            "Using dumpbin: $($dumpbin.Source ?? $dumpbin.FullName)" | Out-File diagnostics/dumpbin.txt
            $testExecutables | ForEach-Object {
              $safeName = $_.BaseName
              & ($dumpbin.Source ?? $dumpbin.FullName) /dependents $_.FullName 2>&1 |
                Out-File "diagnostics/dependents-$safeName.txt"
              & ($dumpbin.Source ?? $dumpbin.FullName) /imports $_.FullName 2>&1 |
                Out-File "diagnostics/imports-$safeName.txt"
            }
          } else {
            "dumpbin.exe was not found on PATH." | Out-File diagnostics/dumpbin-missing.txt
          }
          $llvmObjdump = Get-Command llvm-objdump.exe -ErrorAction SilentlyContinue
          if ($llvmObjdump) {
            $testExecutables | ForEach-Object {
              $safeName = $_.BaseName
              & $llvmObjdump.Source -p $_.FullName 2>&1 |
                Out-File "diagnostics/llvm-objdump-$safeName.txt"
            }
          }

      - name: Upload Rust test diagnostics
        if: ${{ failure() && inputs.run_test_binaries && steps.rust_test_binaries.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-diagnostics
          path: src-tauri/diagnostics

      - name: Clippy
        if: ${{ github.event_name == 'push' || inputs.run_clippy }}
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Tauri app
        if: ${{ inputs.run_tauri_build }}
        run: pnpm run tauri -- build
