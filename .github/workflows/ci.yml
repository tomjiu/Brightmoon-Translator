# CI — uses custom Windows runner label; change runs-on if self-hosted offline.
name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust-check:
    name: Rust Check
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version from package.json packageManager (avoid dual version error)

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend dist
        run: pnpm run build

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Compile cargo tests
        working-directory: src-tauri
        run: cargo test --all-targets --no-run

  frontend-check:
    name: Frontend Check
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version from package.json packageManager (avoid dual version error)

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build

  extension-check:
    name: Extension Check
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate Chrome manifest.json
        working-directory: extension
        run: |
          node -e "
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (!manifest.manifest_version || !manifest.name || !manifest.version) {
            console.error('Invalid manifest.json: missing required fields');
            process.exit(1);
          }
          if (manifest.manifest_version !== 3) {
            console.error('Chrome manifest_version should be 3');
            process.exit(1);
          }
          const hosts = manifest.host_permissions || [];
          const need = [
            'https://www2.deepl.com/*',
            'https://api-edge.cognitive.microsofttranslator.com/*',
          ];
          for (const h of need) {
            if (!hosts.includes(h)) {
              console.error('Missing host_permission:', h);
              process.exit(1);
            }
          }
          console.log('Chrome manifest.json is valid');
          "

      - name: Check JavaScript syntax
        working-directory: extension
        run: |
          node --check background/service-worker.js
          node --check content/selector.js
          node --check content/page-translator.js
          node --check content/hover-translator.js
          node --check popup/popup.js
          echo "All JS files have valid syntax"
